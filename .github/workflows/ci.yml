name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:cloudflare
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tracker?schema=public
          WEBHOOK_SECRET: ci-test-secret
